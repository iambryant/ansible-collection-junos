---
- name: "Ensure Linux QCOW2 boot disk is created"
  ansible.builtin.copy:
    src: "/tmp/ubuntu-26.04-server-cloudimg-amd64.img"
    dest: "/tmp/{{ vnf_instance.name }}.qcow2"
    mode: '0644'

- name: "Ensure instance UUID is generated for cloud-init"
  ansible.builtin.command: uuidgen
  register: vnf_system_uuid
  changed_when: false

- name: "Ensure cloud-init meta-data file is created"
  ansible.builtin.template:
    src: "templates/meta-data.j2"
    dest: "/tmp/meta-data"
    mode: '0644'

- name: "Ensure cloud-init network-config file is present"
  ansible.builtin.template:
    src: "templates/network-config.j2"
    dest: "/tmp/network-config"
    mode: '0644'

- name: "Ensure cloud-init user-data file is present"
  ansible.builtin.template:
    src: "templates/user-data.j2"
    dest: "/tmp/user-data"
    mode: '0644'

- name: "Ensure cloud-init disk is generated"
  ansible.builtin.command: >-
    mkisofs -output {{ vnf_instance.name }}.iso
    -volid cidata -joliet -rock
    meta-data network-config user-data
  args:
    chdir: "/tmp"
    creates: "{{ vnf_instance.name }}.iso"

- name: "Ensure cloud-init files are cleaned up from /tmp"
  ansible.builtin.file:
    path: "/tmp/{{ linux_tmp_file }}"
    state: absent
  loop:
    - "meta-data"
    - "network-config"
    - "user-data"
  loop_control:
    loop_var: "linux_tmp_file"
