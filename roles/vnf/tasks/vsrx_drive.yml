---
- name: "Ensure vSRX QCOW2 boot disk is created"
  ansible.builtin.copy:
    src: "/tmp/junos-vsrx3-x86-64-23.4R2-S5.5.qcow2"
    dest: "/tmp/{{ vnf_instance.name }}.qcow2"
    mode: '0644'

- name: "Ensure vSRX bootstrap configuration file is generated from template"
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/juniper.conf.j2"
    dest: "/tmp/juniper.conf"
    mode: '0644'

- name: "Ensure vSRX bootstrap ISO image is generated"
  ansible.builtin.command: >-
    mkisofs -l -o {{ vnf_instance.name }}.iso juniper.conf
  args:
    chdir: "/tmp"
    creates: "{{ vnf_instance.name }}.iso"

- name: "Ensure vSRX files are cleaned up from /tmp"
  ansible.builtin.file:
    path: "/tmp/juniper.conf"
    state: absent
