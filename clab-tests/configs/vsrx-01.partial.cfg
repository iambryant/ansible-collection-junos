system {
    name-server {
        8.8.4.4 routing-instance mgmt_junos;
        8.8.8.8 routing-instance mgmt_junos;
    }
}

interfaces {
    ge-0/0/0 {
        unit 0 {
            family inet {
                address 172.20.20.3/24;
            }
            family inet6 {
                address 3fff:172:20:20::3/64;
            } 
        }
    }
}

security {
    zones {
        security-zone untrust {
            interfaces {
                ge-0/0/0.0 {
                    host-inbound-traffic {
                        system-services {
                            dhcp;
                            dhcpv6;
                        }
                    }
                }
            }
        }
    }
}

routing-options {
    rib inet6.0 {
        static {
            route ::/0 next-hop 3fff:172:20:20::1;
        }
    }
    static {
        route 0.0.0.0/0 next-hop 172.20.20.1;
    }
}
